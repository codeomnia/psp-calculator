<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1218">
<title>Калькулятор нормативов ПСП и ГДЗС</title>
<style>
body{margin:0;background:#0f1218;color:#8b95a8;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{text-align:center;padding:24px}
.spin{width:36px;height:36px;border:3px solid #2a3142;border-top-color:#e85a2a;border-radius:50%;margin:0 auto 16px;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head><body>
<div class="box"><div class="spin"></div><div>Загрузка…</div></div>
<script src="b0.js"></script>
<script src="b1.js"></script>
<script src="b2.js"></script>
<script src="b3.js"></script>
<script>
(async function(){
  try {
    var b64 = [0,1,2,3].map(function(i){ return window["__B"+i]||""; }).join("");
    if (!b64) throw new Error("no data");
    var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    var stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
    var html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.body.innerHTML = '<p style="padding:24px;text-align:center">Ошибка загрузки<br><small>'+e+'</small></p>';
  }
})();
</script>
</body></html>
